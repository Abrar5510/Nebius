[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "showitonce"
version = "0.1.0"
description = "Film yourself doing a task once on your phone. Any robot learns it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Show It Once" }]
dependencies = [
  "numpy>=1.26",
  "h5py>=3.10",
]

[project.optional-dependencies]
cloud = [
  "openai>=1.50",
  "boto3>=1.34",
  "psycopg[binary]>=3.1",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
showitonce = "showitonce.cli:main"

[tool.setuptools.packages.find]
include = ["showitonce*"]

[tool.setuptools.package-data]
showitonce = ["web/static/*", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
